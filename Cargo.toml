[package]
name = "fallback"
version = "0.3.0"
edition = "2024"

[dependencies]
shared-core = { path = "../shared-assets/shared-rust/shared-core" }
shared-frontend = { path = "../shared-assets/shared-rust/shared-frontend", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
shared-frontend = { path = "../shared-assets/shared-rust/shared-frontend" }
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.70", features = [
    "HtmlCanvasElement",
    "WebGlRenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "Window",
    "Document",
    "HtmlElement",
    "Response",
    "RequestInit",
    "Request",
    "Headers"
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
