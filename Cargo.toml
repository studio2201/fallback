[package]
name = "fallback"
version = "0.1.1"
edition = "2024"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.70", features = [
    "HtmlCanvasElement",
    "WebGlRenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "Window",
    "Document",
    "HtmlElement",
    "Response",
    "RequestInit",
    "Request",
    "Headers"
] }
shared-core = { path = "../shared-assets/shared-rust/shared-core" }
shared-frontend = { path = "../shared-assets/shared-rust/shared-frontend" }
